[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "todesanzeigen"
version = "0.1.0"
description = "OCR and structured extraction pipeline for Todesanzeigen images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "google-cloud-documentai>=3.0.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.5.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
todesanzeigen = "todesanzeigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
